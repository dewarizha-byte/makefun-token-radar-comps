<!doctype html>
<!-- Comps Radar v4 — the dashboard's static shell.
     No framework and no network: this page loads app.css for the theme, then ../data.js
     (written beside dashboard/ by main.ts) which sets window.RADAR — the board, the skip list,
     the KPI strip's held-out evidence and the cover self-check — then app.js renders the whole
     page into #board. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comps Radar v4: pre-token protocols ranked by a fitted, held-out-tested model</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Skip link for keyboard users; #board is the single render target app.js owns. -->
<a class="skip" href="#board">Skip to the board</a>
<main id="board" tabindex="-1" aria-busy="true"></main>
<!-- ../data.js first (it defines window.RADAR), then app.js (it reads it). -->
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
